<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orange / Black Meetup — Palette Switcher</title>
  <style>
    :root {
      /* Active palette tokens. JS rewrites these per preset.
         --tone-filter is what does the heavy lifting on the iframes
         and any imagery. The other tokens style the chrome (label,
         switcher, borders) so the UI matches the active palette. */
      --tone-filter: none;
      --chrome-bg: #050605;
      --chrome-fg: #8b3702;
      --chrome-rule: #8b3702;
      --chrome-bg-soft: #0c0907;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--chrome-bg);
      color: var(--chrome-fg);
      font-family: "Berkeley Mono", "JetBrains Mono", "IBM Plex Mono",
                   ui-monospace, "SF Mono", Consolas, monospace;
    }

    .stack { display: block; width: 100%; }

    .stack iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
      margin: 0;
      padding: 0;
      filter: var(--tone-filter);
      transition: filter 220ms ease;
    }

    /* Top-left meta label, kept tight. */
    .label {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 20;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 4px 8px;
      background: var(--chrome-bg);
      color: var(--chrome-fg);
      border: 1px solid var(--chrome-rule);
      pointer-events: none;
    }

    /* Palette switcher — fixed top-right, mono-style chip strip. */
    .switcher {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: var(--chrome-bg);
      border: 1px solid var(--chrome-rule);
      max-width: min(80vw, 720px);
      justify-content: flex-end;
    }
    .switcher button {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 5px 9px;
      background: var(--chrome-bg-soft);
      color: var(--chrome-fg);
      border: 1px solid var(--chrome-rule);
      cursor: pointer;
      line-height: 1;
    }
    .switcher button:hover {
      background: var(--chrome-fg);
      color: var(--chrome-bg);
    }
    .switcher button[aria-pressed="true"] {
      background: var(--chrome-fg);
      color: var(--chrome-bg);
    }
    .switcher .group-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--chrome-fg);
      opacity: 0.6;
      align-self: center;
      padding: 0 4px 0 2px;
    }
  </style>
</head>
<body>
  <div class="label">orange / black meetup — pg.2 → toc</div>

  <nav class="switcher" aria-label="Palette switcher">
    <span class="group-label">palette</span>
    <button data-preset="original" aria-pressed="true">Original</button>
    <button data-preset="phosphor">Phosphor</button>
    <button data-preset="amber">Amber</button>
    <button data-preset="cyan">Cyan</button>
    <button data-preset="magenta">Magenta</button>
    <button data-preset="grey">Grey</button>
    <button data-preset="bw">B&amp;W</button>
    <button data-preset="sepia">Sepia</button>
    <button data-preset="invert">Invert</button>
    <button data-preset="bluep">Blueprint</button>
  </nav>

  <div class="stack">
    <iframe src="intro.html" title="page 2 — intro"></iframe>
    <iframe src="toc.html" title="table of contents"></iframe>
  </div>

  <script>
    /* Each preset defines:
       - filter: CSS filter chain applied to the iframes (recolors the
                 rendered output, including embedded images / base64 art).
       - chrome: tokens used to retint the wrapper UI so the switcher
                 itself blends with the palette.

       Recipe: grayscale(1) -> sepia(1) collapses the image to a
       single warm hue. hue-rotate then shifts that hue to wherever
       we want; saturate / brightness control intensity. This works
       uniformly because hue-rotate operates on a now-monochromatic
       base, so source colors stop mattering.
    */
    const PRESETS = {
      original: {
        label: "Original",
        filter: "none",
        chrome: { bg:"#050605", fg:"#8b3702", rule:"#8b3702", bgSoft:"#0c0907" },
      },
      phosphor: {
        label: "Phosphor Green (CRT)",
        filter: "grayscale(1) sepia(1) hue-rotate(65deg) saturate(7) brightness(0.95)",
        chrome: { bg:"#000800", fg:"#33ff66", rule:"#33ff66", bgSoft:"#031003" },
      },
      amber: {
        label: "Amber CRT",
        filter: "grayscale(1) sepia(1) hue-rotate(-12deg) saturate(3.6) brightness(1.05)",
        chrome: { bg:"#0a0500", fg:"#ffb000", rule:"#ffb000", bgSoft:"#160c00" },
      },
      cyan: {
        label: "Cyan Terminal",
        filter: "grayscale(1) sepia(1) hue-rotate(170deg) saturate(4) brightness(1.0)",
        chrome: { bg:"#001218", fg:"#3fe6ff", rule:"#3fe6ff", bgSoft:"#02181f" },
      },
      magenta: {
        label: "Magenta",
        filter: "grayscale(1) sepia(1) hue-rotate(255deg) saturate(4) brightness(1.0)",
        chrome: { bg:"#150018", fg:"#ff5cd2", rule:"#ff5cd2", bgSoft:"#1d0220" },
      },
      grey: {
        label: "Grey",
        filter: "grayscale(1) brightness(1.0) contrast(1.0)",
        chrome: { bg:"#0c0c0c", fg:"#cfcfcf", rule:"#cfcfcf", bgSoft:"#161616" },
      },
      bw: {
        label: "High Contrast B&W",
        filter: "grayscale(1) contrast(1.6) brightness(1.0)",
        chrome: { bg:"#000000", fg:"#ffffff", rule:"#ffffff", bgSoft:"#0a0a0a" },
      },
      sepia: {
        label: "Sepia",
        filter: "sepia(1) saturate(1.3) brightness(1.0)",
        chrome: { bg:"#1a0f06", fg:"#d8a866", rule:"#d8a866", bgSoft:"#221409" },
      },
      invert: {
        label: "Inverted",
        filter: "invert(1) hue-rotate(180deg)",
        chrome: { bg:"#f4f4f4", fg:"#1a1a1a", rule:"#1a1a1a", bgSoft:"#e6e6e6" },
      },
      bluep: {
        label: "Blueprint",
        filter: "grayscale(1) sepia(1) hue-rotate(195deg) saturate(5) brightness(0.9) contrast(1.15)",
        chrome: { bg:"#011024", fg:"#7ec8ff", rule:"#7ec8ff", bgSoft:"#021833" },
      },
    };

    const root = document.documentElement;
    const buttons = document.querySelectorAll(".switcher button[data-preset]");
    const labelEl = document.querySelector(".label");

    function applyPreset(name) {
      const p = PRESETS[name];
      if (!p) return;
      root.style.setProperty("--tone-filter", p.filter);
      root.style.setProperty("--chrome-bg", p.chrome.bg);
      root.style.setProperty("--chrome-fg", p.chrome.fg);
      root.style.setProperty("--chrome-rule", p.chrome.rule);
      root.style.setProperty("--chrome-bg-soft", p.chrome.bgSoft);
      labelEl.textContent = "palette: " + p.label.toLowerCase();
      buttons.forEach((b) => {
        b.setAttribute("aria-pressed", b.dataset.preset === name ? "true" : "false");
      });
      try { localStorage.setItem("palette", name); } catch (_) {}
    }

    buttons.forEach((b) => {
      b.addEventListener("click", () => applyPreset(b.dataset.preset));
    });

    let initial = "original";
    try {
      const saved = localStorage.getItem("palette");
      if (saved && PRESETS[saved]) initial = saved;
    } catch (_) {}
    applyPreset(initial);
  </script>
</body>
</html>
