# Directory components to skip (matched at any depth).
exclude_dir_names:
  - .git
  - .venv
  - venv
  - env
  - node_modules
  - __pycache__
  - site-packages
  - dist
  - build
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - .ipynb_checkpoints
  - .tox
  - .nox
  - .cache
  - .claude
  - .codex

# Narrow path substrings to prune. These are not broad directory names because
# roots like /srv/models are valid research evidence, while this specific
# DotAgents desktop model cache would introduce stale upstream mtimes.
exclude_path_substrings:
  - /home/frosty40/workspace/projects/rig-desktop-config/.config/@dotagents/desktop/models/
  - /srv/agents/lanes/agent-orchestrator/state/grafana/plugins/
  - /srv/studio/apps/comfyui/.github/
  - /srv/studio/apps/comfyui/api_server/
  - /srv/studio/apps/comfyui/comfy/
  - /srv/studio/apps/comfyui/comfy_extras/
  - /srv/studio/apps/comfyui/custom_nodes/
  - /srv/studio/apps/comfyui/notebooks/
  - /srv/studio/apps/comfyui/script_examples/
  - /srv/studio/apps/comfyui/tests/
  - /srv/studio/apps/comfyui/web/
  - /home/frosty40/llm_research/parameter-golf-lab/junkyard/vendor/

# Extensions and which handler runs on them.
ext_handler_map:
  ".md": markdown
  ".markdown": markdown
  ".rst": text_summary
  ".txt": text_summary
  ".sh": text_summary
  ".bash": text_summary
  ".yaml": text_summary
  ".yml": text_summary
  ".toml": text_summary
  ".ini": text_summary
  ".cfg": text_summary
  ".conf": text_summary
  ".service": text_summary
  ".timer": text_summary
  ".html": text_summary
  ".css": text_summary
  ".js": text_summary
  ".jsonl": text_summary
  ".launch": text_summary
  ".bak": text_summary
  ".bak1": text_summary
  ".bak2": text_summary
  ".bak3": text_summary
  ".mp4": asset_meta
  ".mov": asset_meta
  ".png": asset_meta
  ".jpg": asset_meta
  ".jpeg": asset_meta
  ".webp": asset_meta
  ".glb": asset_meta
  ".ply": asset_meta
  ".tgz": asset_meta
  ".zip": asset_meta
  ".gz": asset_meta
  ".json": json_summary
  ".py": python_module
  ".csv": csv_meta
  ".tsv": csv_meta
  ".pt": checkpoint_meta
  ".pth": checkpoint_meta
  ".ptz": checkpoint_meta
  ".safetensors": checkpoint_meta
  # Training-run logs — STRICT patterns only (step:N val_bpb:X / final_*).
  # Skipping .txt because in this corpus many .txt files are train_gpt.py
  # source-code copies that mention val_loss in Python assignments — not
  # training output. Re-add .txt later if a content-sniffing variant is built.
  ".log": training_log
  ".out": training_log

# Per-file size caps (bytes). Files larger than this get a "too_large=true"
# stamp and skip the deep parse — only filesystem metadata is recorded.
max_md_bytes: 1048576       # 1 MB — anything bigger is logs, not notes
max_text_bytes: 1048576     # 1 MB — configs/manifests/launchers only
max_asset_bytes: 0          # metadata only for images/videos/archives
max_json_bytes: 5242880     # 5 MB
max_py_bytes: 524288        # 512 KB
max_csv_bytes: 10485760     # 10 MB — header + nrows only anyway
max_log_bytes: 10485760     # 10 MB — typical training log is 10–500KB
max_pt_bytes: 0             # 0 means "always treat as metadata-only"


# Git repos to walk for commits — author-date is the ground-truth activity
# signal that mtime doesn't capture. Each commit becomes one record.
git_repos:
  - {path: /home/frosty40/llm_research/parameter-golf-lab, label: "git:parameter-golf-lab"}
  - {path: /home/frosty40/ml-lab,                          label: "git:ml-lab"}
  - {path: /home/frosty40/workspace/projects/dotagents-mono, label: "git:dotagents_mono", since: "2026-03-01", until: "2026-03-08"}
  - {path: /home/frosty40/workspace/projects/Qwen-Agent,     label: "git:qwen_agent", since: "2026-03-01", until: "2026-03-07"}
  - {path: /home/frosty40/llm_research/sota_crawler,        label: "git:sota_crawler"}
  - {path: /home/frosty40/llm_research/sota_nueral,         label: "git:sota_nueral"}
  - {path: /home/frosty40/llm_research/SOTA_FINAL,          label: "git:SOTA_FINAL"}
  - {path: /home/frosty40/llm_research/sota_rascal,         label: "git:sota_rascal"}
  - {path: /home/frosty40/llm_research/pg_whale,            label: "git:pg_whale"}
  - {path: /home/frosty40/llm_research/rascal-private,      label: "git:rascal-private"}

# Claude Code session JSONLs — these capture the user-Claude collaboration
# work-stream that mtime doesn't show.
claude_projects_root: /home/frosty40/.claude/projects

# Codex session JSONLs (broader than just rollout_summaries we already have)
codex_sessions_root: /home/frosty40/.codex/sessions

# Output
sqlite_path: /home/frosty40/research_collator/index.sqlite
extraction_version: "stripper_v2"

# Legacy field retained for old scripts. The daily renderer follows TEMPLATE.md:
# day_index starts at the first proven parameter-golf research date,
# 2026-03-18, so 2026-03-18 = DAY 001, and ends at the final Mockingbird
# submission on 2026-05-01.
day_epoch: null
